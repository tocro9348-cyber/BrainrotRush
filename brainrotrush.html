async function bCreate(){if(!FB)return toast('Для батлов с игроками нужна общая база');const c=bcost();if(me.bal<c)return toast('Не хватает монет');me.bal-=c;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);const h=bRolls(BT.n);bWaitUI({host:me.nick,n:BT.n,case:BT.case});await fb('battles/'+id,'PUT',{id,host:me.nick,n:BT.n,case:BT.case,hostRolls:h,hostVal:bVal(h),status:'open',created:Date.now()});save();toast('Комната создана, ждём соперника');bWatch(id)}
async function bList(){const el=$('#blist');if(!el)return;if(!FB){el.innerHTML='<small>Нужна общая база</small>';return}const all=await fb('battles');const arr=Object.values(all||{}).filter(b=>b&&(b.status==='open'||b.status==='done')).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,12);el.innerHTML=arr.length?arr.map(b=>{const info=`${b.host===me.nick?'<b>Твоя</b>':'@'+b.host} · ${b.case||'Дешевый'} · ${b.n} кейсов · ${fmt(b.n*bPrice(b.case))} 🪙`;const act=b.status==='open'?(b.host===me.nick?`<button onclick="bCancel('${b.id}')">Отмена</button>`:`<button class=or onclick="bJoin('${b.id}')">Войти</button>`):'✅ завершён';return `<div class=plate>${cImg(bCase(b.case||'Дешевый'),36)}${info} ${act} <button onclick="bWatch('${b.id}')">👁 Смотреть</button></div>`}).join(''):'<small>Комнат нет</small>'}
async function bWatch(id){bStop();let played=false;const tick=async()=>{const b=await fb('battles/'+id);if(!b)return;if(b.status==='done'){bStop();if(!played){played=true;await bPlay(b);if(b.winner===me.nick&&!b.claimed)bClaim()}}else if(!$('#awt'))bWaitUI(b)};await tick();if(BWATCH===null&&!played)BWATCH=setInterval(tick,2500)}

const spin=async id=>{const el=$('#'+id);if(!el)return;await sleep(60);const w=el.parentElement.clientWidth;el.style.transition='transform 2.6s cubic-bezier(.1,.7,.1,1)';el.style.transform=`translateX(${-(34*78+39-w/2+R(-22,22))}px)`;await sleep(2700)};

async function bJoin(id){if(!FB)return;const b=await fb('battles/'+id);if(!b||b.status!=='open')return toast('Батл уже недоступен');if(b.host===me.nick)return toast('Это твоя комната');const c=b.n*bPrice(b.case);if(me.bal<c)return toast('Не хватает монет');me.bal-=c;const g=bRolls(b.n,b.case),gv=bVal(g);const hostWins=b.hostVal>gv||(b.hostVal===gv&&Math.random()<.5);const winner=hostWins?b.host:me.nick;const fin={...b,guest:me.nick,guestRolls:g,guestVal:gv,winner,status:'done',claimed:false};await fb('battles/'+id,'PUT',fin);if(winner===me.nick){bAward([...b.hostRolls,...g]);await fb('battles/'+id+'/claimed','PUT',true)}save();bStop();await bPlay(fin)}
async function bClaim(){if(!FB||!me)return;const all=await fb('battles');for(const b of Object.values(all||{})){if(b&&b.status==='done'&&b.winner===me.nick&&!b.claimed&&b.guestRolls){bAward([...b.hostRolls,...b.guestRolls]);await fb('battles/'+b.id+'/claimed','PUT',true);save()}}}
async function bCancel(id){const b=await fb('battles/'+id);if(!b||b.status!=='open'||b.host!==me.nick)return;me.bal+=b.n*bPrice(b.case);await fb('battles/'+id,'DELETE');save();toast('Комната закрыта, монеты вернулись');bUI()}
let MN={m:3,pick:[],S:0,names:[],mines:null,open:null,on:false,done:false,pay:0};
const mnMult=(m,k)=>{let x=0.96;for(let i=0;i<k;i++)x*=(25-i)/(25-m-i);return x};
function mnUI(){if(!me)return;const op=MN.open||new Set(),k=op.size;const mult=mnMult(MN.m,k),next=mnMult(MN.m,k+1);
const S=MN.on?MN.S:MN.pick.reduce((a,i)=>a+(V[me.inv[i]]||0),0);

function mnPick(i){if(MN.on)return;const j=MN.pick.indexOf(i);if(j>=0)MN.pick.splice(j,1);else{if(MN.pick.length>=5)return toast('Максимум 5 брейнротов');MN.pick.push(i)}mnUI()}
function mnStart(){if(!MN.pick.length)return toast('Выбери брейнроты в ставку');const idx=[...MN.pick].sort((a,b)=>b-a);MN.names=idx.map(i=>me.inv[i]).reverse();MN.S=MN.names.reduce((a,n)=>a+(V[n]||0),0);idx.forEach(i=>me.inv.splice(i,1));const cells=[...Array(25).keys()].sort(()=>Math.random()-.5);MN.mines=new Set(me.antiMine?[]:cells.slice(0,MN.m));MN.open=new Set();MN.rev={};MN.on=true;MN.done=false;MN.pick=[];MN.pay=0;save();mnUI()}
function mnPic(){if(Math.random()<.5)return '<span style="font-size:28px">🪙</span>';const ks=Object.keys(IMG).filter(k=>IMG[k]);const k=ks[Math.random()*ks.length|0];return `<img src="${IMG[k]}" style="width:100%;height:100%;object-fit:contain" title="${k}">`}
function mnOpen(i){if(!MN.on||MN.done||(MN.open&&MN.open.has(i)))return;if(MN.mines.has(i)){MN.done=true;MN.on=false;MN.pay=0;sfx('bad');save();mnUI();return toast('💥 Мина! Ставка сгорела')}MN.open.add(i);MN.rev=MN.rev||{};MN.rev[i]=mnPic();sfx('tick');if(MN.open.size===25-MN.m)return mnCash();mnUI()}
function mnCash(){if(!MN.on||MN.done)return;const k=MN.open.size;if(k===0)return toast('Открой хотя бы одну клетку');const pay=Math.floor(MN.S*mnMult(MN.m,k));me.bal+=pay;MN.pay=pay;MN.done=true;MN.on=false;sfx('up');save();mnUI();toast('+'+fmt(pay)+' 🪙')}
function mnNew(){MN.rev={};MN.open=null;MN.mines=null;MN.done=false;MN.on=false;MN.S=0;MN.names=[];MN.pay=0;mnUI()}
function sellOne(i){const n=me.inv[i];if(n===undefined)return;me.inv.splice(i,1);me.bal+=V[n]||0;save();toast('+'+fmt(V[n]||0)+' 🪙 за '+n);profUI()}
function sellAll(){if(!me.inv.length)return toast('Инвентарь пуст');if(!confirm('Продать все брейнроты?'))return;const sum=me.inv.reduce((a,n)=>a+(V[n]||0),0);me.inv=[];me.bal+=sum;save();toast('+'+fmt(sum)+' 🪙');profUI()}
